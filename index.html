<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1e8"><title>Шлакоблокунь — угадай всех</title><style>
:root{--paper:#f4f1e8;--ink:#171717;--muted:#74716b;--accent:#e8b923;--card:#fffdf7;--line:#ded9cd}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{background-image:radial-gradient(#00000009 1px,transparent 1px);background-size:12px 12px}.app{min-height:100vh;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}.top{width:100%;max-width:640px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:1000;letter-spacing:-.8px;font-size:18px}.count{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}.screen{width:100%;max-width:640px;margin:auto}.intro{text-align:center;padding:34px 20px}.eyebrow{font-size:11px;letter-spacing:2.5px;font-weight:900;color:#9a7710}.title{font-size:clamp(42px,13vw,72px);line-height:.86;letter-spacing:-4px;font-weight:1000;margin:13px 0 20px}.subtitle{font-size:16px;line-height:1.45;color:var(--muted);max-width:360px;margin:0 auto}.btn{appearance:none;border:0;border-radius:18px;padding:17px 18px;font-weight:950;font-size:15px;cursor:pointer;min-height:56px}.primary{background:var(--ink);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.start{margin-top:24px;width:100%}.game{display:flex;flex-direction:column;gap:12px}.progress{height:6px;background:#dfdacd;border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0;transition:width .25s ease}.photo-card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:10px;box-shadow:0 12px 40px #00000012}.photo-wrap{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:18px;overflow:hidden}.photo-wrap img{width:100%;height:100%;object-fit:contain}.question{text-align:center;font-size:14px;color:var(--muted);font-weight:800;letter-spacing:.3px;margin:2px 0 0}.answer{background:var(--ink);color:#fff;border-radius:20px;padding:18px 16px;text-align:center;display:none;animation:reveal .22s ease}.answer.show{display:block}.answer-label{font-size:10px;letter-spacing:2px;color:#bdbdbd;font-weight:900}.answer-name{font-size:clamp(28px,8vw,46px);font-weight:1000;letter-spacing:-1.5px;margin-top:4px}.actions{display:grid;grid-template-columns:1fr;gap:9px}.hidden{display:none!important}.result{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:34px 20px}.result .big{font-size:70px;line-height:1;font-weight:1000;letter-spacing:-5px}.result h2{font-size:28px;letter-spacing:-1px;margin:10px 0}.result p{color:var(--muted);line-height:1.45}@keyframes reveal{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}@media(min-width:600px){.photo-wrap{aspect-ratio:1.08/1}.actions{grid-template-columns:1fr 1fr}.actions .show-only{grid-column:1/-1}.intro{padding:52px 30px}}
</style></head><body><div class="app"><header class="top"><div class="logo">ШЛАКОБЛОКУНЬ 🎣</div><div class="count" id="count"></div></header><main class="screen"><section id="intro" class="intro"><div class="eyebrow">МЕМ-КВИЗ</div><div class="title">УГАДАЙ<br>ИХ ВСЕХ</div><div class="subtitle">Смотри на картинку. Вспоминай имя. И только потом открывай ответ.</div><button class="btn primary start" id="start">НАЧАТЬ →</button></section><section id="game" class="game hidden"><div class="progress"><div class="bar" id="bar"></div></div><div class="photo-card"><div class="photo-wrap"><img id="pic" alt="Загадка"></div></div><div class="question">КТО ЭТО?</div><div class="answer" id="answer"><div class="answer-label">ПРАВИЛЬНЫЙ ОТВЕТ</div><div class="answer-name" id="answerName"></div></div><div class="actions"><button class="btn secondary" id="show">ПОКАЗАТЬ ОТВЕТ</button><button class="btn primary hidden" id="next">СЛЕДУЮЩИЙ →</button></div></section><section id="result" class="result hidden"><div class="eyebrow">РАУНД ЗАВЕРШЁН</div><div class="big" id="total"></div><h2>Ты пережил встречу со Шлакоблокунем.</h2><p>Это первая версия. Следом добавим уровни сложности, баллы, таймер и режим для компании.</p><button class="btn primary start" id="again">ЕЩЁ РАЗ →</button></section></main></div><script>
const people=[{"name": "Коровка передач", "file": "01.jpg"}, {"name": "Крокодилдо", "file": "02.jpg"}, {"name": "Бухтар", "file": "03.jpg"}, {"name": "Свинера", "file": "04.jpg"}, {"name": "Попугайка", "file": "05.jpg"}, {"name": "Лисабля", "file": "06.jpg"}, {"name": "Беконь", "file": "07.jpg"}, {"name": "Чебурёнка", "file": "08.jpg"}, {"name": "Шутка", "file": "09.jpg"}, {"name": "Тирамисуслик", "file": "10.jpg"}, {"name": "Пенопласточка", "file": "11.jpg"}, {"name": "Карусельдь", "file": "12.jpg"}, {"name": "Апельсвин", "file": "13.jpg"}, {"name": "Шлакоблокунь", "file": "14.jpg"}, {"name": "Крысало", "file": "15.jpg"}, {"name": "Колбасуля", "file": "16.jpg"}];
let deck=[],i=0;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function render(){const p=deck[i];$('count').textContent=`${i+1} / ${deck.length}`;$('bar').style.width=(i/deck.length*100)+'%';$('pic').src='images/'+p.file;$('answerName').textContent=p.name;$('answer').classList.remove('show');$('show').classList.remove('hidden');$('next').classList.add('hidden')}function start(){deck=shuffle(people);i=0;$('intro').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');render()}$('start').onclick=start;$('again').onclick=start;$('show').onclick=()=>{$('answer').classList.add('show');$('show').classList.add('hidden');$('next').classList.remove('hidden');$('bar').style.width=((i+1)/deck.length*100)+'%'};$('next').onclick=()=>{if(i<deck.length-1){i++;render()}else{$('game').classList.add('hidden');$('result').classList.remove('hidden');$('count').textContent='';$('total').textContent=deck.length+'/'+deck.length}};
</script></body></html>
