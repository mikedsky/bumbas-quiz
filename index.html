<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шлакоблокунь Quiz</title>
<style>
body{margin:0;background:#101014;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{min-height:100vh;display:flex;flex-direction:column;padding:20px 18px}
.top,.screen{width:100%;max-width:560px;margin:auto}.top{display:flex;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:900}.counter{color:#aaa}.card{background:#19191e;border:1px solid #303038;border-radius:28px;padding:20px;box-shadow:0 20px 60px #0006}
.hero{text-align:center}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#f2c94c;font-weight:800}
.title{font-size:clamp(34px,10vw,52px);line-height:.98;font-weight:950;letter-spacing:-2px;margin:9px 0}.sub{color:#aaa;line-height:1.5}
.meme{min-height:350px;border-radius:20px;background:linear-gradient(145deg,#f1eee6,#d9d5cc);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.emoji{font-size:clamp(80px,24vw,140px);display:flex;align-items:center;gap:5px;filter:drop-shadow(0 10px 8px #0003)}
.plus{font-size:28px;color:#333;font-weight:900}.caption{position:absolute;bottom:12px;color:#3338;font-size:10px;font-weight:800}
.answer{display:none;text-align:center;padding-top:16px}.answer.show{display:block}.answer small{color:#aaa;font-size:11px}.answer h2{font-size:clamp(30px,9vw,46px);margin:5px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.start{grid-template-columns:1fr}
.btn{border:0;border-radius:17px;padding:16px 12px;font-weight:850;font-size:15px}.primary{background:#f5f5f7;color:#111}.secondary{background:#28282e;color:#fff;border:1px solid #36363e}
.progress{height:5px;background:#29292f;border-radius:9px;overflow:hidden;margin-bottom:16px}.bar{height:100%;background:#f2c94c;width:0;transition:.25s}.hidden{display:none!important}.result{text-align:center}.score{font-size:68px;font-weight:950;letter-spacing:-4px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">ШЛАКОБЛОКУНЬ 🎣</div><div class="counter" id="counter"></div></header>
<main class="screen">
<section id="intro" class="hero card">
<div class="eyebrow">MVP · версия 0.1</div>
<div class="title">Угадай<br>Шлакоблокуня</div>
<div class="sub">10 гибридов. Сначала картинка — потом ответ.</div>
<div class="actions start"><button class="btn primary" id="start">НАЧАТЬ ИГРУ</button></div>
</section>
<section id="game" class="hidden">
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="card"><div class="meme" id="meme"></div>
<div class="answer" id="answer"><small>ПРАВИЛЬНЫЙ ОТВЕТ</small><h2 id="answerText"></h2></div></div>
<div class="actions"><button class="btn secondary" id="show">ПОКАЗАТЬ ОТВЕТ</button><button class="btn primary hidden" id="next">СЛЕДУЮЩИЙ →</button></div>
</section>
<section id="result" class="hidden card result">
<div class="eyebrow">Раунд завершён</div><div class="score" id="score"></div>
<h2>Шлакоблокунь одобряет 😎</h2><p style="color:#aaa">Следующим этапом добавим реальные картинки, уровни и баллы.</p>
<div class="actions start"><button class="btn primary" id="again">ИГРАТЬ ЕЩЁ</button></div>
</section>
</main></div>
<script>
const people=[
{name:'Шлакоблокунь',emoji:['🧱','🐟']},
{name:'Сомолёт',emoji:['🐟','✈️']},
{name:'Спорткарась',emoji:['🏎️','🐟']},
{name:'Карусельдь',emoji:['🎠','🐟']},
{name:'Форельса',emoji:['🐟','🛤️']},
{name:'Очкилька',emoji:['🐟','👓']},
{name:'Хромосом',emoji:['🌐','🐟']},
{name:'Гугорь',emoji:['🔎','🐟']},
{name:'Шлакоблось',emoji:['🧱','🫎']},
{name:'Тройной Шлакоблокунь',emoji:['🧱','🐟','🐟','🐟']}
];
let deck=[],i=0;const $=x=>document.getElementById(x);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function render(){let p=deck[i];$('counter').textContent=(i+1)+' / '+deck.length;$('bar').style.width=(i/deck.length*100)+'%';$('meme').innerHTML='<div class="emoji">'+p.emoji.map((x,n)=>'<span>'+x+'</span>'+(n<p.emoji.length-1?'<span class="plus">+</span>':'')).join('')+'</div><div class="caption">БЕЗ ПОДПИСИ</div>';$('answerText').textContent=p.name;$('answer').classList.remove('show');$('show').classList.remove('hidden');$('next').classList.add('hidden')}
function start(){deck=shuffle(people);i=0;$('intro').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');render()}
$('start').onclick=start;$('again').onclick=start;
$('show').onclick=()=>{$('answer').classList.add('show');$('show').classList.add('hidden');$('next').classList.remove('hidden');$('bar').style.width=((i+1)/deck.length*100)+'%'};
$('next').onclick=()=>{if(i<deck.length-1){i++;render()}else{$('game').classList.add('hidden');$('result').classList.remove('hidden');$('counter').textContent='';$('score').textContent=deck.length+'/'+deck.length}};
</script>
</body>
</html>
